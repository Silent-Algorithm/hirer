<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="favoriteIconPage">Hirer - Favourites</title>
  <link rel="stylesheet" href="src/input.css">
  <script defer src="script.js"></script>
  <script defer src="favourite.js"></script>
</head>
<body class="overflow-x-hidden bg-white dark:bg-dark-theme-bg dark:text-[#cbcbcb]">

<header class="sticky top-0 z-50">
  <nav class="dark:bg-dark-theme-bg dark:text-[#cbcbcb] flex items-center justify-between m-0 border-b-2 dark:border-[#202226] border-[#e5e5e5db] px-[4%] py-3 w-full bg-white">
    <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-blue-700 dark:text-blue-500">Hirer</h1>

    <div class="flex gap-7 md:gap-14">
      <!--profile-->
      <img class="rounded-full h-7 sm:h-8 sm:w-8 md:h-9 md:w-9 lg:w-10 lg:h-10" src="src/assets/profile.png" alt="profile">

      <!-- Language selector -->
      <select class="outline-0 text-sm dark:bg-dark-theme-bg dark:text-[#cbcbcb]" name="language" id="language">
        <option value="en">English</option>
        <option value="fr">French</option>
      </select>
    </div>
  </nav>
</header>

<main id="mainSection" class="-z-10 mt-8 text-sm">

  <!-- Empty state (shown when no favourites) -->
  <div id="emptyState" style="display:none;" class="flex-col items-center justify-center py-28 px-8 text-center">
    <svg class="fill-gray-300 dark:fill-gray-600 mb-5" xmlns="http://www.w3.org/2000/svg" height="72px" viewBox="0 -960 960 960" width="72px">
      <path d="M200-120v-640q0-33 23.5-56.5T280-840h400q33 0 56.5 23.5T760-760v640L480-240 200-120Zm80-122 200-86 200 86v-518H280v518Zm0-518h400-400Z"/>
    </svg>
    <h2 class="text-xl font-bold text-gray-400 dark:text-gray-500">No favourites yet</h2>
    <p class="text-gray-400 dark:text-gray-600 mt-2 text-sm">Tap the bookmark icon on any post to save it here.</p>
    <a href="home.html">
      <button class="mt-6 bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full font-semibold transition shadow-md">
        Browse Posts
      </button>
    </a>
  </div>

  <!-- Cards injected here by favourite.js -->
  <section id="favouritesSection" class="flex flex-col items-center justify-center w-full space-y-5 pb-28">
  </section>

</main>

<footer class="relative mt-40 flex sm:justify-center ease-in-out duration-75 cursor-pointer">
  <div id="footerSection" class="fixed bottom-0 w-full h-16 flex items-center justify-around border-2 dark:bg-[#101010ee] dark:text-[#cbcbcb] m-0 border-b-2 dark:border-[#202226ed] border-[#e5e5e5db] bg-[#fffffff4] sm:w-[65%] lg:w-[55%] sm:mb-2 sm:rounded-4xl">

    <div id="homeIcon" class="flex flex-col items-center">
      <!-- home icon: -->
      <svg class="dark:fill-[#cbcbcb]" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="M240-200h120v-240h240v240h120v-360L480-740 240-560v360Zm-80 80v-480l320-240 320 240v480H520v-240h-80v240H160Zm320-350Z"/></svg>
      <p>Home</p>
    </div>

    <div id="searchIcon" class="flex flex-col items-center">
      <!-- search icon -->
      <svg class="dark:fill-[#cbcbcb]" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
      <p>Search</p>
    </div>

    <div id="createIcon">
      <div class="border-2 rounded-full p-1">
        <!-- add icon: -->
        <svg class="dark:fill-[#cbcbcb]" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="M440-120v-320H120v-80h320v-320h80v320h320v80H520v320h-80Z"/></svg>
      </div>
    </div>

    <div id="favoriteIcon" class="flex flex-col items-center">
      <!-- favorite icon: -->
      <svg id="footerIcon" class="dark:fill-[#cbcbcb]" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="m480-120-58-52q-101-91-167-157T150-447.5Q111-500 95.5-544T80-634q0-94 63-157t157-63q52 0 99 22t81 62q34-40 81-62t99-22q94 0 157 63t63 157q0 46-15.5 90T810-447.5Q771-395 705-329T538-172l-58 52Zm0-108q96-86 158-147.5t98-107q36-45.5 50-81t14-70.5q0-60-40-100t-100-40q-47 0-87 26.5T518-680h-76q-15-41-55-67.5T300-774q-60 0-100 40t-40 100q0 35 14 70.5t50 81q36 45.5 98 107T480-228Zm0-273Z"/></svg>
      <p id="footerIconText">Favorite</p>
    </div>

    <div id="profileIcon" class="flex flex-col items-center">
      <!-- profile icon: -->
      <svg class="dark:fill-[#cbcbcb]" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="black"><path d="M367-527q-47-47-47-113t47-113q47-47 113-47t113 47q47 47 47 113t-47 113q-47 47-113 47t-113-47ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q66 0 130 15.5T736-378q29 15 46.5 43.5T800-272v112H160Zm80-80h480v-32q0-11-5.5-20T700-306q-54-27-109-40.5T480-360q-56 0-111 13.5T260-306q-9 5-14.5 14t-5.5 20v32Zm296.5-343.5Q560-607 560-640t-23.5-56.5Q513-720 480-720t-56.5 23.5Q400-673 400-640t23.5 56.5Q447-560 480-560t56.5-23.5ZM480-640Zm0 400Z"/></svg>
      <p>Profile</p>
    </div>

  </div>
</footer>

</body>
</html>
