<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Login</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
</head>

<body class="bg-gray-100 dark:bg-gray-900 transition duration-300">

  <!-- Header -->
  <div class="flex justify-between items-center p-4 max-w-6xl mx-auto">
    <h1 class="text-xl font-bold text-blue-600 dark:text-blue-400">Hirer</h1>

    <!-- Dark Mode Toggle -->
    <button id="themeToggle" 
      class="px-3 py-1 rounded-full bg-gray-200 dark:bg-gray-700 text-sm">
      🌙
    </button>
  </div>

  <!-- Main Container -->
  <div class="flex items-center justify-center min-h-[80vh] px-4">
    
    <div class="bg-white dark:bg-gray-800 shadow-lg rounded-2xl w-full max-w-md p-6">

      <!-- Tabs -->
      <div class="flex justify-around mb-6">
        <button id="loginTab" class="font-semibold text-blue-600 border-b-2 border-blue-600 pb-1">
          Login
        </button>
        <button id="signupTab" class="text-gray-500 dark:text-gray-300 pb-1">
          Sign Up
        </button>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-4">
        <input type="email" placeholder="Email"
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700"/>
        <input type="password" placeholder="Password"
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700"/>

        <button class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
          Login
        </button>

        <p class="text-sm text-center text-gray-500 dark:text-gray-400">
          Don't have an account? 
          <span id="goSignup" class="text-blue-600 cursor-pointer">Sign up</span>
        </p>
      </form>

      <!-- Signup Form -->
      <form id="signupForm" class="space-y-4 hidden" action="#" method="POST">
        <input type="text" placeholder="Full Name"
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700"/>
        <input type="email" placeholder="Email"
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700"/>
        <input type="password" placeholder="Password"
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700"/>

        <button class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
          Sign Up
        </button>

        <p class="text-sm text-center text-gray-500 dark:text-gray-400">
          Already have an account? 
          <span id="goLogin" class="text-blue-600 cursor-pointer">Login</span>
        </p>
      </form>

    </div>
  </div>

  <!-- JS -->
  <script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const goSignup = document.getElementById("goSignup");
    const goLogin = document.getElementById("goLogin");

    // Toggle Forms
    function showLogin() {
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      loginTab.classList.add("text-blue-600", "border-b-2", "border-blue-600");
      signupTab.classList.remove("text-blue-600", "border-b-2");
    }

    function showSignup() {
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      signupTab.classList.add("text-blue-600", "border-b-2", "border-blue-600");
      loginTab.classList.remove("text-blue-600", "border-b-2");
    }

    loginTab.onclick = showLogin;
    signupTab.onclick = showSignup;
    goSignup.onclick = showSignup;
    goLogin.onclick = showLogin;

    // Dark Mode Toggle
    const toggle = document.getElementById("themeToggle");

    toggle.addEventListener("click", () => {
      document.documentElement.classList.toggle("dark");

      toggle.textContent = 
        document.documentElement.classList.contains("dark") ? "☀️" : "🌙";
    });

    // Handle login form
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = loginForm.querySelector('input[type="email"]').value;
      const password = loginForm.querySelector('input[type="password"]').value;
      try {
        const res = await fetch('http://localhost:8000/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          window.location.href = 'index.html';
        } else {
          alert(data.detail);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });

    // Handle signup form
    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = signupForm.querySelector('input[type="text"]').value;
      const email = signupForm.querySelector('input[type="email"]').value;
      const password = signupForm.querySelector('input[type="password"]').value;
      try {
        const res = await fetch('http://localhost:8000/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.access_token);
          window.location.href = 'index.html';
        } else {
          alert(data.detail);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    });
  </script>

</body>
</html>
