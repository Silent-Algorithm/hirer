<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Login</title>

  <script defer src="script.js"></script>
  <link rel="stylesheet" href="src/input.css">
</head>

<body class="bg-[#f5f7fb] dark:bg-dark-theme-bg dark:text-[#e5e7eb] transition duration-300 min-h-screen">
<a href="home.html">home</a>
  <!-- Header -->
  <header class="sticky top-0 z-50">

    <nav id="navbar"
      class="bg-white/90 dark:bg-[#111318]/95 backdrop-blur-md dark:text-[#e5e7eb] flex items-center justify-between border-b border-gray-200 dark:border-[#23262d] px-[5%] py-4 w-full shadow-sm">

      <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-blue-700 dark:text-blue-500">
        Hirer
      </h1>

      <div class="flex gap-7 md:gap-14 items-center">

        <!-- Language -->
        <select
          class="outline-none bg-transparent border border-gray-300 dark:border-[#303540] rounded-lg px-3 py-1.5 dark:bg-[#151821]"
          name="language"
          id="language">

          <option value="en">English</option>
          <option value="fr">French</option>
        </select>

        <!-- Theme Toggle -->
        <svg
          id="toggleTheme"
          class="fill-[#f6a84f] dark:fill-[#cbcbcb] h-6 w-6 sm:h-7 sm:w-7 md:h-8 md:w-8 cursor-pointer transition"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 -960 960 960">

          <path d="M337.5-463Q311-498 289-537q-5 14-6.5 28.5T281-480q0 83 58 141t141 58q14 0 28.5-2t28.5-6q-39-22-74-48.5T396-396q-32-32-58.5-67ZM567-364.5Q630-328 702-308q-40 51-98 79.5T481-200q-117 0-198.5-81.5T201-480q0-65 28.5-123t79.5-98q20 72 56.5 135T453-452q51 51 114 87.5ZM743-380q-20-5-39.5-11T665-405q8-18 11.5-36.5T680-480q0-83-58.5-141.5T480-680q-20 0-38.5 3.5T405-665q-8-19-13.5-38T381-742q24-9 49-13.5t51-4.5q117 0 198.5 81.5T761-480q0 26-4.5 51T743-380ZM440-840v-120h80v120h-80Zm0 840v-120h80V0h-80Zm323-706-57-57 85-84 57 56-85 85ZM169-113l-57-56 85-85 57 57-85 84Zm671-327v-80h120v80H840ZM0-440v-80h120v80H0Zm791 328-85-85 57-57 84 85-56 57ZM197-706l-84-85 56-57 85 85-57 57Z"/>
        </svg>

      </div>
    </nav>
  </header>

  <!-- Main -->
  <main class="flex items-center justify-center min-h-[80vh] px-4 py-10">

    <div class=" w-full max-w-md rounded-3xl border border-gray-200 dark:border-[#23262d] bg-white dark:bg-[#151821] p-8 shadow-[0_10px_40px_rgba(0,0,0,0.08)] dark:shadow-[0_10px_40px_rgba(0,0,0,0.35)]">

      <!-- Tabs -->
      <div class="flex justify-around mb-8 border-b border-gray-200 dark:border-[#23262d] pb-2 ">

        <button id="loginTab"
          class="font-semibold text-blue-600 border-b-2 border-blue-600 pb-2 px-2 transition fon">
          Login
        </button>

        <button id="signupTab"
          class="text-gray-500 dark:text-gray-400 pb-2 px-2 transition font-extrabold">
          Sign Up
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-5 ">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-[#303540] bg-white dark:bg-[#1c212b] focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition"/>

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-[#303540] bg-white dark:bg-[#1c212b] focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition"/>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 active:scale-[0.99] transition">
          Login
        </button>

        <p class="text-sm text-center text-gray-500 dark:text-gray-400 pt-2">
          Don't have an account?
          <span id="goSignup" class="text-blue-600 hover:text-blue-700 font-medium cursor-pointer transition">
            Sign up
          </span>
        </p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="space-y-5 hidden">

        <input
          id="signupName"
          type="text"
          placeholder="Full Name"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-[#303540] bg-white dark:bg-[#1c212b] focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition"/>

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-[#303540] bg-white dark:bg-[#1c212b] focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition"/>

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-300 dark:border-[#303540] bg-white dark:bg-[#1c212b] focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 outline-none transition"/>

        <button
          type="submit"
          class="w-full bg-green-600 text-white py-3 rounded-xl font-medium hover:bg-green-700 active:scale-[0.99] transition">
          Sign Up
        </button>

        <p class="text-sm text-center text-gray-500 dark:text-gray-400 pt-2">
          Already have an account?
          <span id="goLogin" class="text-blue-600 hover:text-blue-700 font-medium cursor-pointer transition">
            Login
          </span>
        </p>
      </form>

    </div>

  </main>

  <!-- JAVASCRIPT -->
  <script>

    // =========================
    // ELEMENTS
    // =========================

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const goSignup = document.getElementById("goSignup");
    const goLogin = document.getElementById("goLogin");


    // =========================
    // TOGGLE FORMS
    // =========================

    function showLogin() {

      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");

      loginTab.classList.add(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );

      signupTab.classList.remove(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );
    }

    function showSignup() {

      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");

      signupTab.classList.add(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );

      loginTab.classList.remove(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );
    }

    loginTab.onclick = showLogin;
    signupTab.onclick = showSignup;

    goSignup.onclick = showSignup;
    goLogin.onclick = showLogin;

    // Theme toggle and restore are handled by script.js

    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("loginEmail").value;

      const password =
        document.getElementById("loginPassword").value;

      try {

        const response = await fetch(
          "http://127.0.0.1:8000/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        // backend error
        if(!response.ok){

          alert(data.detail || "Login failed");
          return;
        }

        // save token
        localStorage.setItem(
          "token",
          data.access_token
        );

        alert("Login successful");

        // redirect
        window.location.href = "./home.html";

      } catch(error){

        console.log(error);

        alert("Server error");
      }
    });

    // =========================
    // SIGNUP
    // =========================

    signupForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const name =
        document.getElementById("signupName").value;

      const email =
        document.getElementById("signupEmail").value;

      const password =
        document.getElementById("signupPassword").value;

      try {

        const response = await fetch(
          "http://127.0.0.1:8000/auth/register",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              name,
              email,
              password
            })
          }
        );

        const data = await response.json();

        if(!response.ok){

          alert(data.detail || "Signup failed");
          return;
        }

        // save token
        localStorage.setItem(
          "token",
          data.access_token
        );

        alert("Account created");

        window.location.href = "./home.html";

      } catch(error){

        console.log(error);

        alert("Server error");
      }
    });

  </script>

</body>
</html>
