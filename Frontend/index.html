<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Login</title>

  <script defer src="script.js"></script>
  <link rel="stylesheet" href="src/input.css">
</head>

<body class="bg-gray-100 dark:bg-dark-theme-bg dark:text-[#cbcbcb] transition duration-300 min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-50">
    
    <nav id="navbar"
      class="dark:bg-dark-theme-bg dark:text-[#cbcbcb] flex items-center justify-between border-b-2 dark:border-[#202226] border-[#e5e5e5db] px-[4%] py-3 w-full bg-white">

      <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-blue-700 dark:text-blue-500">
        Hirer
      </h1>

      <div class="flex gap-7 md:gap-14 items-center">

        <!-- Language -->
        <select class="outline-0 dark:bg-dark-theme-bg" name="language" id="language">
          <option value="en">English</option>
          <option value="fr">French</option>
        </select>

        <!-- Theme Toggle -->
        <svg
          id="toggleTheme"
          class="fill-[#f6a84f] dark:fill-[#cbcbcb] h-6 w-6 sm:h-7 sm:w-7 md:h-8 md:w-8 cursor-pointer"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 -960 960 960">

          <path d="M337.5-463Q311-498 289-537q-5 14-6.5 28.5T281-480q0 83 58 141t141 58q14 0 28.5-2t28.5-6q-39-22-74-48.5T396-396q-32-32-58.5-67ZM567-364.5Q630-328 702-308q-40 51-98 79.5T481-200q-117 0-198.5-81.5T201-480q0-65 28.5-123t79.5-98q20 72 56.5 135T453-452q51 51 114 87.5ZM743-380q-20-5-39.5-11T665-405q8-18 11.5-36.5T680-480q0-83-58.5-141.5T480-680q-20 0-38.5 3.5T405-665q-8-19-13.5-38T381-742q24-9 49-13.5t51-4.5q117 0 198.5 81.5T761-480q0 26-4.5 51T743-380ZM440-840v-120h80v120h-80Zm0 840v-120h80V0h-80Zm323-706-57-57 85-84 57 56-85 85ZM169-113l-57-56 85-85 57 57-85 84Zm671-327v-80h120v80H840ZM0-440v-80h120v80H0Zm791 328-85-85 57-57 84 85-56 57ZM197-706l-84-85 56-57 85 85-57 57Z"/>
        </svg>

      </div>
    </nav>
  </header>

  <!-- Main -->
  <main class="flex items-center justify-center min-h-[80vh] px-4 py-10">

    <div class="dark:border dark:border-gray-800 shadow-lg rounded-2xl w-full max-w-md p-6 bg-white dark:bg-dark-theme-bg">

      <!-- Tabs -->
      <div class="flex justify-around mb-6">
        <button id="loginTab"
          class="font-semibold text-blue-600 border-b-2 border-blue-600 pb-1">
          Login
        </button>

        <button id="signupTab"
          class="text-gray-500 dark:text-gray-300 pb-1">
          Sign Up
        </button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="space-y-4">

        <input
          id="loginEmail"
          type="email"
          placeholder="Email"
          required
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 outline-none"/>

        <input
          id="loginPassword"
          type="password"
          placeholder="Password"
          required
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 outline-none"/>

        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">
          Login
        </button>

        <p class="text-sm text-center text-gray-500 dark:text-gray-400">
          Don't have an account?
          <span id="goSignup" class="text-blue-600 cursor-pointer">
            Sign up
          </span>
        </p>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="space-y-4 hidden">

        <input
          id="signupName"
          type="text"
          placeholder="Full Name"
          required
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 outline-none"/>

        <input
          id="signupEmail"
          type="email"
          placeholder="Email"
          required
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 outline-none"/>

        <input
          id="signupPassword"
          type="password"
          placeholder="Password"
          required
          class="w-full px-4 py-2 rounded-lg border dark:border-gray-600 dark:bg-gray-700 outline-none"/>

        <button
          type="submit"
          class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 transition">
          Sign Up
        </button>

        <p class="text-sm text-center text-gray-500 dark:text-gray-400">
          Already have an account?
          <span id="goLogin" class="text-blue-600 cursor-pointer">
            Login
          </span>
        </p>
      </form>

    </div>

  </main>

  <!-- JAVASCRIPT -->
  <script>

    // =========================
    // ELEMENTS
    // =========================

    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const goSignup = document.getElementById("goSignup");
    const goLogin = document.getElementById("goLogin");

    const toggleTheme = document.getElementById("toggleTheme");

    // =========================
    // TOGGLE FORMS
    // =========================

    function showLogin() {

      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");

      loginTab.classList.add(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );

      signupTab.classList.remove(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );
    }

    function showSignup() {

      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");

      signupTab.classList.add(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );

      loginTab.classList.remove(
        "text-blue-600",
        "border-b-2",
        "border-blue-600"
      );
    }

    loginTab.onclick = showLogin;
    signupTab.onclick = showSignup;

    goSignup.onclick = showSignup;
    goLogin.onclick = showLogin;

    // =========================
    // THEME TOGGLE
    // =========================

    toggleTheme.addEventListener("click", () => {

      document.documentElement.classList.toggle("dark");

      const isDark =
        document.documentElement.classList.contains("dark");

      localStorage.setItem("theme", isDark ? "dark" : "light");
    });

    // restore theme
    const savedTheme = localStorage.getItem("theme");

    if(savedTheme === "dark"){
      document.documentElement.classList.add("dark");
    }

    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const email =
        document.getElementById("loginEmail").value;

      const password =
        document.getElementById("loginPassword").value;

      try {

        const response = await fetch(
          "http://127.0.0.1:8000/auth/login",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              email,
              password
            })
          }
        );

        const data = await response.json();

        // backend error
        if(!response.ok){

          alert(data.detail || "Login failed");
          return;
        }

        // save token
        localStorage.setItem(
          "token",
          data.access_token
        );

        alert("Login successful");

        // redirect
        window.location.href = "./home.html";

      } catch(error){

        console.log(error);

        alert("Server error");
      }
    });

    // =========================
    // SIGNUP
    // =========================

    signupForm.addEventListener("submit", async (e) => {

      e.preventDefault();

      const name =
        document.getElementById("signupName").value;

      const email =
        document.getElementById("signupEmail").value;

      const password =
        document.getElementById("signupPassword").value;

      try {

        const response = await fetch(
          "http://127.0.0.1:8000/auth/register",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              name,
              email,
              password
            })
          }
        );

        const data = await response.json();

        if(!response.ok){

          alert(data.detail || "Signup failed");
          return;
        }

        // save token
        localStorage.setItem(
          "token",
          data.access_token
        );

        alert("Account created");

        window.location.href = "./home.html";

      } catch(error){

        console.log(error);

        alert("Server error");
      }
    });

  </script>

</body>
</html>
