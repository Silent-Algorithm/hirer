<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="src/input.css" />

  <script defer src="./edit_profile.js"></script>
  <script defer src="script.js"></script>

  <title>Edit Profile</title>
</head>

<body class="bg-[#f5f5f5] dark:bg-dark-theme-bg min-h-screen">

  <!-- HEADER -->
  <header
    class="sticky top-0 bg-white dark:bg-dark-theme-bg border-b border-gray-200 dark:border-[#202226] px-5 py-4 z-50"
  >

    <div class="flex items-center justify-between">

      <!-- BACK BUTTON -->
      <button
        onclick="window.location.href='./profile.html'"
        class="text-xl font-bold"
      >
        ←
      </button>

      <h1 class="font-bold text-lg dark:text-white">
        Edit Profile
      </h1>

      <!--Theme-->
      <svg class="fill-[#f6a84f] dark:fill-[#cbcbcb] h-6 sm:h-7 sm:w-7 md:h-8 md:w-8 lg:h-9 lg:w-9 cursor-pointer" id="toggleTheme" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"><path d="M337.5-463Q311-498 289-537q-5 14-6.5 28.5T281-480q0 83 58 141t141 58q14 0 28.5-2t28.5-6q-39-22-74-48.5T396-396q-32-32-58.5-67ZM567-364.5Q630-328 702-308q-40 51-98 79.5T481-200q-117 0-198.5-81.5T201-480q0-65 28.5-123t79.5-98q20 72 56.5 135T453-452q51 51 114 87.5ZM743-380q-20-5-39.5-11T665-405q8-18 11.5-36.5T680-480q0-83-58.5-141.5T480-680q-20 0-38.5 3.5T405-665q-8-19-13.5-38T381-742q24-9 49-13.5t51-4.5q117 0 198.5 81.5T761-480q0 26-4.5 51T743-380ZM440-840v-120h80v120h-80Zm0 840v-120h80V0h-80Zm323-706-57-57 85-84 57 56-85 85ZM169-113l-57-56 85-85 57 57-85 84Zm671-327v-80h120v80H840ZM0-440v-80h120v80H0Zm791 328-85-85 57-57 84 85-56 57ZM197-706l-84-85 56-57 85 85-57 57Zm199 310Z"/></svg>

    </div>

  </header>

  <!-- MAIN -->
  <main class="p-5 flex justify-center">

    <div
      class="w-full max-w-xl bg-white dark:bg-[#181818] rounded-3xl p-6 shadow-lg flex flex-col gap-6"
    >

      <!-- PROFILE IMAGE -->
      <div class="flex flex-col items-center gap-3">

        <div
  onclick="document.getElementById('profileImageInput').click()"
  class="h-28 w-28 rounded-full border-4 border-blue-600 overflow-hidden cursor-pointer"
>

          <img
      id="profilePreview"
      class="h-full w-full object-cover"
      src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='gray'%3E%3Cpath d='M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5Zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5Z'/%3E%3C/svg%3E"
    />
          <div class="flex flex-col gap-2">
  <label class="font-bold">Profile Image</label>

  <input
    type="file"
    id="profileImageInput"
    accept="image/*"
    class="hidden"
  />
</div>

        </div>

      </div>

      <!-- NAME -->
      <div class="flex flex-col gap-2">

        <label class="font-semibold dark:text-white">
          Name
        </label>

        <input
          id="editName"
          type="text"
          placeholder="Enter your name"
          class="border border-gray-300 dark:border-[#2d2d2d] bg-transparent rounded-xl p-4 outline-none"
        >

      </div>

      <!-- BIO -->
      <div class="flex flex-col gap-2">

        <label class="font-semibold dark:text-white">
          Bio
        </label>

        <textarea
          id="editBio"
          placeholder="Tell people about yourself"
          class="border border-gray-300 dark:border-[#2d2d2d] bg-transparent rounded-xl p-4 outline-none h-28 resize-none"
        ></textarea>

      </div>

      <!-- SKILLS -->
      <div class="flex flex-col gap-2">

        <label class="font-semibold dark:text-white">
          Skills
        </label>

        <input
          id="editSkills"
          type="text"
          placeholder="HTML, CSS, JavaScript"
          class="border border-gray-300 dark:border-[#2d2d2d] bg-transparent rounded-xl p-4 outline-none"
        >

      </div>

      <!-- WHATSAPP -->
      <div class="flex flex-col gap-2">

        <label class="font-semibold dark:text-white">
          WhatsApp Link
        </label>

        <input
          id="editWhatsapp"
          type="text"
          placeholder="https://wa.me/237..."
          required
          class="border border-gray-300 dark:border-[#2d2d2d] bg-transparent rounded-xl p-4 outline-none"
        >

      </div>

<!-- LOCATION --> 
<div class="flex flex-col gap-4">

  <label class="flex items-center gap-3 dark:text-white cursor-pointer">

    <input
      type="checkbox"
      id="useCurrentLocation"
      class="h-4 w-4"
    >

    <span class="font-semibold">
      Use current location
    </span>

  </label>

  <input
    type="text"
    id="locationSearch"
    placeholder="Enter city or location"
    class="border border-gray-300 dark:border-[#2d2d2d] bg-transparent rounded-xl p-4 outline-none"
  >

</div>

      <!-- SAVE BUTTON -->
      <button
        id="saveProfileBtn"
        class="bg-blue-600 hover:bg-blue-700 transition text-white py-4 rounded-2xl font-semibold"
      >
        Save Changes
      </button>

    </div>

  </main>

</body>

</html>
